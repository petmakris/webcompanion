name: release
# Builds and publishes to PyPI when a version tag is pushed. Nothing in
# this repository pushes that tag automatically -- tagging and pushing the
# tag is the maintainer's own, deliberate action.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install build twine
      - name: no runtime dependencies
        run: python3 -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; sys.exit(0 if d==[] else 1)"
      - run: python3 -m pip install -e .
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q
      - run: python3 -m build
      - run: python3 -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC) -- no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
