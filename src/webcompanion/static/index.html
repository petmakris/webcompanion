<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webcompanion</title>
<link rel="icon" type="image/svg+xml" href="/_wc/favicon.svg">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e2e5ea; --ink: #1b1e26;
    --muted: #6b7280; --accent: #3a5cf0; --live: #0f7a50; --live-bg: #e3f3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: .85rem; margin: .25rem 0 1.75rem; }
  h2 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; margin: 1.75rem 0 .5rem;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: .4rem; }
  a.row {
    display: flex; align-items: baseline; gap: .6rem; padding: .65rem .85rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    text-decoration: none; color: inherit;
  }
  a.row:hover { border-color: var(--accent); }
  .title { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--line); flex: none; align-self: center; }
  .live .dot { background: var(--live); }
  .live .title::after {
    content: "live"; margin-left: .55rem; font-size: .7rem; font-weight: 600;
    color: var(--live); background: var(--live-bg); padding: .1rem .4rem; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .04em;
  }

  /* The tools. A grid rather than a list because there are a handful of them and
     they are a menu, not a history — the eye should take them in at once. */
  .kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .6rem; }
  a.kind {
    display: block; padding: .9rem 1rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    text-decoration: none; color: inherit;
  }
  a.kind:hover { border-color: var(--accent); }
  .kind-name { font-weight: 600; display: flex; align-items: center; gap: .45rem; }
  .kind-count { color: var(--muted); font-size: .8rem; margin-top: .15rem; }
  a.kind.has-live .kind-count { color: var(--live); font-weight: 500; }
  a.kind.has-live .dot { background: var(--live); }

  .back {
    display: inline-block; color: var(--muted); text-decoration: none;
    font-size: .85rem; margin-bottom: 1rem;
  }
  .back:hover { color: var(--accent); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><a href="#" style="color:inherit;text-decoration:none">webcompanion</a></h1>
  <p class="sub" id="sub">loading…</p>
  <div id="view"></div>
</main>
<script>
"use strict";
// TWO HOPS, NOT ONE PAGE. The first version listed every session of every kind,
// which on a working machine is several screens of other people's work — you
// came to see atlas and read 38 show-diff rows to find it. So the landing page
// is the tools, and a tool's sessions are one click away.
//
// The exception is anything LIVE. "What is running right now" is the question
// this page exists to answer, and an answer behind a click is a worse answer, so
// live sessions are hoisted to the top of the landing page whatever kind they
// belong to. There are never many: a live session is one somebody is waiting on.
const CONTRACT = "X-WebCompanion-Contract";
const view = document.getElementById("view");
const sub = document.getElementById("sub");
let rows = [];

// ── Owner token ────────────────────────────────────────────────────────
// /api/sessions is owner-gated even for reads -- it names every workspace
// on the daemon, not just one the caller already knows about. Loopback is
// the owner by construction; anyone else needs this token, exactly as a
// single session page does (see core.js, which this mirrors). It arrives
// in the URL fragment, which browsers never send to the server and never
// log, so the link can be pasted into a terminal or a note without the
// credential leaking through the request path. Held in sessionStorage,
// not localStorage: a shared or borrowed device forgets it when the tab
// closes. Captured and stripped before route() ever reads location.hash,
// so a "#k=..." link never gets misread as a kind name.
const TOKEN_HEADER = "X-WebCompanion-Token";
const TOKEN_KEY = "webcompanion.token." + window.location.host;
const token = (() => {
  const m = /(?:^|[#&])k=([^&]+)/.exec(window.location.hash || "");
  if (m) {
    const t = decodeURIComponent(m[1]);
    try { sessionStorage.setItem(TOKEN_KEY, t); } catch (_) {}
    try {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    } catch (_) {}
    return t;
  }
  try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; }
})();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// A sid is YYMMDD-HHMMSS-<hex>, so a plain string sort is a chronological one.
function newestFirst(a, b) { return String(b.sid).localeCompare(String(a.sid)); }
function liveFirst(a, b) {
  return (a.state === "live" ? 0 : 1) - (b.state === "live" ? 0 : 1) || newestFirst(a, b);
}

function shorten(cwd) {
  if (!cwd) return "";
  const parts = String(cwd).split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : cwd;
}

function sessionRow(r) {
  const li = el("li");
  const a = el("a", "row" + (r.state === "live" ? " live" : ""));
  a.href = r.url;
  const t = el("span", "title", r.title || r.slug || r.sid);
  const w = el("span", "where", shorten(r.cwd));
  a.append(el("span", "dot"), t, w);
  li.appendChild(a);
  return li;
}

function sessionList(items) {
  const ul = el("ul");
  items.forEach((r) => ul.appendChild(sessionRow(r)));
  return ul;
}

function byKind() {
  const m = new Map();
  for (const r of rows) {
    if (!m.has(r.kind)) m.set(r.kind, []);
    m.get(r.kind).push(r);
  }
  return m;
}

function renderIndex() {
  const live = rows.filter((r) => r.state === "live").sort(newestFirst);
  const groups = byKind();
  sub.textContent = rows.length
    ? `${groups.size} tool${groups.size === 1 ? "" : "s"}, ${rows.length} session${rows.length === 1 ? "" : "s"}, ${live.length} live`
    : "no sessions yet";

  view.textContent = "";
  if (live.length) {
    view.appendChild(el("h2", null, "running now"));
    view.appendChild(sessionList(live));
  }
  if (!rows.length) {
    view.appendChild(el("p", "empty", "Nothing has been pushed to this daemon yet."));
    return;
  }

  view.appendChild(el("h2", null, "tools"));
  const grid = el("div", "kinds");
  const kinds = [...groups.keys()].sort();
  for (const kind of kinds) {
    const items = groups.get(kind);
    const n = items.filter((r) => r.state === "live").length;
    const a = el("a", "kind" + (n ? " has-live" : ""));
    a.href = "#" + encodeURIComponent(kind);
    const name = el("span", "kind-name");
    if (n) name.appendChild(el("span", "dot"));
    name.appendChild(document.createTextNode(kind));
    a.appendChild(name);
    a.appendChild(el("span", "kind-count",
      n ? `${n} live · ${items.length} total` : `${items.length} session${items.length === 1 ? "" : "s"}`));
    grid.appendChild(a);
  }
  view.appendChild(grid);
}

function renderKind(kind) {
  const items = (byKind().get(kind) || []).sort(liveFirst);
  const n = items.filter((r) => r.state === "live").length;
  sub.textContent = items.length
    ? `${kind} · ${items.length} session${items.length === 1 ? "" : "s"}, ${n} live`
    : `${kind} · nothing here`;

  view.textContent = "";
  const back = el("a", "back", "← all tools");
  back.href = "#";
  view.appendChild(back);
  if (!items.length) {
    view.appendChild(el("p", "empty", "No sessions of this kind."));
    return;
  }
  view.appendChild(sessionList(items));
}

function route() {
  const kind = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  // An unknown kind falls back to the index rather than an empty page: the hash
  // is a bookmark somebody kept, and a kind can be gone by the time it is opened.
  if (kind && byKind().has(kind)) renderKind(kind);
  else renderIndex();
}

async function refresh() {
  try {
    const headers = { [CONTRACT]: "1" };
    if (token) headers[TOKEN_HEADER] = token;
    const res = await fetch("/api/sessions?scope=all", { headers });
    if (res.status === 403) {
      sub.textContent = "this listing is for the owner of this daemon";
      return;
    }
    if (!res.ok) throw new Error(res.status);
    rows = await res.json();
    route();
  } catch (e) {
    sub.textContent = "could not reach the daemon";
  }
}

window.addEventListener("hashchange", route);
refresh();
// A poll, not a stream. The session LIST changes when a session is created or
// ends — a handful of times an hour — and a per-session SSE connection for each
// row would spend a stream slot apiece to learn it.
setInterval(refresh, 5000);
</script>
</body>
</html>
